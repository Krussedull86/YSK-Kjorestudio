<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YSK · Mobilregistrering</title><style>body{font:17px system-ui;background:#0b1423;color:#eef5fa;max-width:600px;margin:auto;padding:20px}input,select,textarea,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;margin:6px 0 16px;border-radius:8px;border:1px solid #233650;background:#142238;color:#edf4ff}button{background:#49d8bd;color:#0b1423;font-weight:bold}small{color:#b6c5d1}label{display:block}#status{white-space:pre-wrap}a{color:#56d1bc}</style><h1>YSK kjørestudio</h1><p>Registrer tur 1–5. PC-en må være på og koblet til samme nettverk.</p><form id="form"><label>Tilgangskode<input id="token" required autocomplete="off" type="password"></label><label>Sjåfør<input name="driver" list="driver_choices" required maxlength="100"></label><label>Kurs / gruppe<input name="course" list="course_choices" required maxlength="100"></label><label>Kjøretøy / sammenligningsgruppe<input name="vehicle" list="vehicle_choices" required maxlength="100"></label><label>Tur<select name="trip"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>Dato<input name="date" type="date"></label><label>Starttid<input name="start_time" type="time"></label><label>Forbrukt tid (minutter)<input name="minutes" type="number" min="0.01" step="any" required></label><label>Kjørt (km)<input name="km" type="number" min="0.01" step="any" required></label><label>Brukt drivstoff (liter totalt)<input name="liters" type="number" min="0" step="any" required></label><label>Unødige stopp<input name="stops" type="number" min="0" step="1" required></label><label>Gjennomsnitt km/t (valgfritt)<input name="average_speed" type="number" min="0" step="any"></label><p id="consumption">Forbruk per 10 km beregnes fra liter og km.</p><label>Lærer / signatur (navn eller initialer)<input name="teacher" maxlength="100"></label><datalist id="driver_choices"></datalist><datalist id="course_choices"></datalist><datalist id="vehicle_choices"></datalist><div id="ratings"></div><label>Notater<textarea name="notes" maxlength="2000"></textarea></label><button>Lagre tur</button></form><p id="status" role="status"></p><button id="retry" type="button">Send ventende registreringer</button><button id="discard" type="button">Fjern første ventende registrering</button><small>Ved brudd i forbindelsen beholdes registreringen på denne telefonen. Trykk «Send ventende» når PC-en er tilgjengelig igjen. Bruk et privat nettverk.</small><script>
const form=document.querySelector('form'),status=document.querySelector('#status');let busy=false;
for(const k of ['trafikksikkerhet','avpassing','økning','komfort'])document.querySelector('#ratings').insertAdjacentHTML('beforeend',`<label>${k==='avpassing'?'Fartsavpassing':k==='økning'?'Fartsøkning':k[0].toUpperCase()+k.slice(1)}<select name="${k}"><option>Bra</option><option selected value="Middel">Middels</option><option>Svak</option></select></label>`);
form.elements.date.value=new Date().toLocaleDateString('sv-SE');
form.addEventListener('input',()=>{let km=Number(form.elements.km.value),liter=Number(form.elements.liters.value);document.querySelector('#consumption').textContent=km>0?'Forbruk per 10 km: '+(10*liter/km).toFixed(2)+' liter':'Legg inn liter og km';});
async function choices(){try{let r=await fetch('/api/choices',{headers:{'X-Token':document.querySelector('#token').value}});if(!r.ok)return;let x=await r.json();for(let k of ['driver','course','vehicle']){let list=document.getElementById(k+'_choices');list.replaceChildren();for(let name of x[k]){let option=document.createElement('option');option.value=name;list.append(option);}}}catch(e){}}
document.querySelector('#token').addEventListener('change',choices);
function queue(){return JSON.parse(localStorage.getItem('ysk_queue')||'[]')}
function save(q){localStorage.setItem('ysk_queue',JSON.stringify(q))}
async function send(){if(busy)return;busy=true;try{let q=queue();while(q.length){let r=await fetch('/api/trips',{method:'POST',headers:{'Content-Type':'application/json','X-Token':document.querySelector('#token').value},body:JSON.stringify(q[0])});let x=await r.json();if(!r.ok)throw Error(x.error);q.shift();save(q)}status.textContent='Alt er lagret på PC-en.';choices()}catch(e){status.textContent='Ikke sendt: '+e.message+'\nVentende: '+queue().length}finally{busy=false}}
form.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(form));d.id=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);let q=queue();q.push(d);save(q);send()};document.querySelector('#retry').onclick=send;document.querySelector('#discard').onclick=()=>{if(busy)return;if(confirm('Fjerne første ventende registrering fra telefonen? Den sendes da ikke til PC-en.')){let q=queue();q.shift();save(q);status.textContent='Ventende registreringer: '+q.length}};window.addEventListener('online',send);status.textContent='Ventende registreringer: '+queue().length;
</script></html>
