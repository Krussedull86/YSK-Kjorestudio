name: YSK dev
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      platform:
        description: Plattform som skal bygges og publiseres
        type: choice
        default: auto
        options: [auto, windows, android, both]
permissions:
  contents: read
concurrency:
  group: ysk-dev
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.select.outputs.windows }}
      android: ${{ steps.select.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        env:
          BEFORE: ${{ github.event.before }}
          TARGET: ${{ inputs.platform || 'auto' }}
        run: python scripts/select_platforms.py
  windows:
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -v
      - run: python -m pip install pyinstaller==6.16.0
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name YSK_Kjorestudio --add-data "mobile.html;." main.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/YSK_Kjorestudio.exe
          if-no-files-found: error
  android:
    needs: changes
    if: ${{ needs.changes.outputs.android == 'true' && vars.YSK_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Test cloud permissions
        run: |
          node cloud/functions/ysk-admin/test.mjs
          node cloud/functions/ysk-admin/test_updates.mjs
          node cloud/functions/ysk-admin/test_trips.mjs
          node cloud/functions/ysk-publish/test.mjs
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore private signing key
        env:
          KEYSTORE: ${{ secrets.YSK_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.YSK_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.YSK_ANDROID_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          import base64,os,pathlib
          p=pathlib.Path('android/signing');p.mkdir(parents=True,exist_ok=True)
          for key in ['KEYSTORE','STORE_PASSWORD','KEY_PASSWORD']:
              if not os.environ.get(key):raise SystemExit('Missing Android signing secret: '+key)
          (p/'ysk-release.p12').write_bytes(base64.b64decode(os.environ['KEYSTORE']))
          (p/'password.txt').write_text(os.environ['STORE_PASSWORD'])
          (p/'key_password.txt').write_text(os.environ['KEY_PASSWORD'])
          PY
      - name: Test trip stopwatch
        run: |
          mkdir -p timer-test
          javac -d timer-test android/src/no/talappen/ysk/TripTimer.java android/tests/TripTimerTest.java
          java -cp timer-test TripTimerTest
      - name: Test stop counter
        run: |
          javac -d timer-test android/src/no/talappen/ysk/StopCounter.java android/tests/StopCounterTest.java
          java -cp timer-test StopCounterTest
      - name: Test incomplete and omitted fields
        run: |
          javac -encoding UTF-8 -d timer-test android/src/no/talappen/ysk/TripCompletion.java android/tests/TripCompletionTest.java
          java -cp timer-test TripCompletionTest
      - name: Stamp Android version for this release
        run: |
          python - <<'PYVERSION'
          from pathlib import Path
          import re
          from version import VERSION, BUILD
          p = Path('android/AndroidManifest.xml')
          text = re.sub(r'android:versionCode="[^"]+"', f'android:versionCode="{BUILD}"', p.read_text())
          p.write_text(re.sub(r'android:versionName="[^"]+"', f'android:versionName="{VERSION}"', text))
          PYVERSION
      - run: python android/build_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/YSK_Kjorestudio_Android.apk
          if-no-files-found: error
  publish-dev:
    if: ${{ always() && vars.YSK_RELEASE_ENABLED == 'true' && (needs.windows.result == 'success' || needs.android.result == 'success') && (needs.windows.result == 'success' || needs.windows.result == 'skipped') && (needs.android.result == 'success' || needs.android.result == 'skipped') }}
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: release_output
      - run: python scripts/publish_dev.py
